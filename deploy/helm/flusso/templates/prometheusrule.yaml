{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "flusso.fullname" . }}
  namespace: {{ .Values.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "flusso.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: flusso_alerts
      rules:
        - alert: FlussoVisibilityWait
          expr: flusso_replication_visibility_wait_seconds > 30
          for: 1m
          labels:
            severity: {{ .Values.prometheusRule.severity }}
          annotations:
            summary: "flusso has held a commit that isn't visible for {{ "{{" }} $value | humanizeDuration {{ "}}" }}"
            description: >-
              Postgres keeps a commit invisible while it waits for a synchronous
              standby. Nothing after it is indexed until it is visible: bring the
              standby back, or take it out of synchronous_standby_names and reload.
            runbook_url: https://alias2k.github.io/flusso/reference/source-postgres.html#behind-a-synchronous-standby
        - alert: FlussoLaneStalled
          expr: flusso_lane_stall_age_seconds > {{ .Values.prometheusRule.laneStallSeconds }}
          for: {{ .Values.prometheusRule.for }}
          labels:
            severity: {{ .Values.prometheusRule.severity }}
            reason: age
          annotations:
            summary: "flusso's {{ "{{" }} $labels.index {{ "}}" }} lane into {{ "{{" }} $labels.sink {{ "}}" }} has landed nothing for {{ "{{" }} $value | humanizeDuration {{ "}}" }}"
            description: >-
              The lane's oldest change has not been written to the sink. Until it
              is, the replication slot keeps WAL for every index. Look at the
              sink's errors in the log (a write block on the index, a document
              refused under on_error = "stop", the cluster down), then fix the
              cause, skip the document, or reindex.
            runbook_url: https://alias2k.github.io/flusso/operate/stalled-lane.html
        - alert: FlussoLaneStalled
          expr: flusso_lane_wal_behind_bytes > {{ .Values.prometheusRule.laneWalBehindBytes | int64 }} and flusso_lane_stall_age_seconds > {{ .Values.prometheusRule.laneWalStallSeconds }}
          for: {{ .Values.prometheusRule.for }}
          labels:
            severity: {{ .Values.prometheusRule.severity }}
            reason: wal
          annotations:
            summary: "flusso's {{ "{{" }} $labels.index {{ "}}" }} lane into {{ "{{" }} $labels.sink {{ "}}" }} has landed nothing for over a minute while the slot keeps {{ "{{" }} $value | humanize1024 {{ "}}" }}B of WAL behind it"
            description: >-
              The lane's oldest change has not been written to the sink. Until it
              is, the replication slot keeps WAL for every index. Look at the
              sink's errors in the log (a write block on the index, a document
              refused under on_error = "stop", the cluster down), then fix the
              cause, skip the document, or reindex.
            runbook_url: https://alias2k.github.io/flusso/operate/stalled-lane.html
        - alert: FlussoLaneParked
          expr: flusso_lane_parked > 0
          for: {{ .Values.prometheusRule.for }}
          labels:
            severity: {{ .Values.prometheusRule.severity }}
          annotations:
            summary: "flusso's {{ "{{" }} $labels.index {{ "}}" }} lane into {{ "{{" }} $labels.sink {{ "}}" }} is parked ({{ "{{" }} $labels.why {{ "}}" }})"
            description: >-
              flusso stopped writing this index to this sink: a document
              refused under on_error = "stop" (refused), the index refusing
              writes (blocked: a write block, a role without write permission),
              or a target that staging can't bring back (restaging). The other
              indexes keep being written; this one holds the replication slot.
              /status names why under sinks.<sink>.lanes.<index>.reason.
            runbook_url: https://alias2k.github.io/flusso/operate/stalled-lane.html
        - alert: FlussoIndexBacklog
          expr: max by (index) (flusso_index_exempt) > 0 or max by (index) (flusso_index_backlog_age_seconds) > {{ .Values.prometheusRule.indexBacklogSeconds }}
          for: {{ .Values.prometheusRule.indexBacklogFor }}
          labels:
            severity: {{ .Values.prometheusRule.severity }}
          annotations:
            summary: "flusso's {{ "{{" }} $labels.index {{ "}}" }} index has been exempt or stuck for {{ .Values.prometheusRule.indexBacklogFor }}"
            description: >-
              The index has been exempt (held at max_waiting_per_index while the
              other indexes read on: its changes are kept as documents to build, up
              to max_pending_documents, and the slot stays pinned by it), or stuck
              (its oldest change not built yet was read over {{ .Values.prometheusRule.indexBacklogSeconds }} s ago: nothing of it
              is being built), the whole period. It also fires during a planned
              catch-up longer than {{ .Values.prometheusRule.indexBacklogFor }} when one index is slower than the others
              (it is exempt meanwhile): silence it, or raise the period. /status names
              why under ingest.indexes.<index>: held_by and held_sinks (a full lane: the
              sink is slow, refusing or down, see FlussoLaneStalled and
              FlussoLaneParked; or the memory budget), working (false: a sink has
              acknowledged nothing for 5 s), backlog_seconds, pacing_reader. How far
              an index is behind the source is not this alert: read its lanes' WAL
              behind (flusso_lane_wal_behind_bytes) and the slot lag
              (flusso_replication_slot_lag_bytes).
            runbook_url: https://alias2k.github.io/flusso/operate/stalled-lane.html
{{- end }}
