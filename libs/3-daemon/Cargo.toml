[package]
name = "flusso-daemon"
version = "0.17.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Daemon that assembles and runs the flusso pipeline from a Config."
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["database"]
readme.workspace = true

[lib]
name = "daemon"

[lints]
workspace = true

[dependencies]
config.workspace = true
kernel.workspace = true
engine.workspace = true
source.workspace = true
chrono = { workspace = true, features = ["clock"] }
stream.workspace = true
sink.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }

[dev-dependencies]
serde_json.workspace = true
stream-channel.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
# The fence e2e (`tests/fence.rs`) runs a whole deployment against a real
# Postgres and a real OpenSearch: a fence is only worth its name if a read
# right after it really sees the commit.
source-postgres.workspace = true
sink-opensearch.workspace = true
sqlx.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres", "http_wait"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
