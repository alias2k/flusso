[package]
name = "flusso-engine"
version = "0.15.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The flusso engines: the ingest engine (capture, build once, publish) and the sink engine (receive, apply, flush, ack)."
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["database"]
readme.workspace = true

[lib]
name = "engine"

[lints]
workspace = true

[dependencies]
source.workspace = true
sink.workspace = true
stream.workspace = true
kernel.workspace = true
async-trait.workspace = true
chrono = { workspace = true, features = ["clock"] }
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
stream-channel.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
# Concrete source + sink, exercised together only here — the engine is the one
# component that legitimately spans both halves of the pipeline.
source-postgres.workspace = true
sink-opensearch.workspace = true
sqlx.workspace = true
rust_decimal.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres", "http_wait"] }
criterion.workspace = true
# The full-pipeline e2e (`tests/pipeline.rs`) reads the real OpenSearch index
# back to assert what actually landed.
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde_json.workspace = true
# `RUST_LOG`-driven engine logs while an e2e runs (`--no-capture`), so a
# misbehaving run can be diagnosed from what the engine said, not just from
# the index it left behind.
tracing-subscriber.workspace = true

# In-process component bench: both engines over the real channel stream with
# mocked source/builder/sink. No Docker; this is the PR-gating bench.
[[bench]]
name = "engine"
harness = false

# Full pipeline component bench: real Postgres -> the engines -> real OpenSearch,
# for attribution. Spins up both containers, so requires Docker.
[[bench]]
name = "pipeline"
harness = false
