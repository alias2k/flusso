[package]
name = "flusso-kernel-derive"
version = "0.15.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Derive macro for flusso adapter configuration: #[derive(AdapterConfig)] declares an adapter's options, schema, and examples once."
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["development-tools::procedural-macro-helpers"]
readme = "README.md"

[lib]
name = "kernel_derive"
proc-macro = true

[lints]
workspace = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
# The kernel with the derive re-exported: the real consumer surface (a
# dev-dependency cycle, which Cargo allows).
kernel = { path = "..", package = "flusso-kernel", features = ["derive"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
trybuild = "1"
