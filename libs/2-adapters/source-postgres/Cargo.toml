[package]
name = "flusso-source-postgres"
version = "0.15.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Postgres logical-replication source for flusso: WAL capture, backfill, and document building."
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["database"]
readme.workspace = true

[lib]
name = "source_postgres"

[lints]
workspace = true

[features]
# Exposes a public entry point into the otherwise-internal pgoutput decoder for
# the `fuzz/` cargo-fuzz crate. Off by default; not part of the stable API.
fuzzing = []
# Exposes the pgoutput decoder to the in-process `pgoutput` bench. Off by
# default; not part of the stable API.
bench = []

[dependencies]
source.workspace = true
kernel = { workspace = true, features = ["derive"] }
serde.workspace = true
schemars.workspace = true
nutype.workspace = true
regex.workspace = true
bon.workspace = true
pgwire-replication.workspace = true
async-trait.workspace = true
futures.workspace = true
tracing.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["sync"] }
url.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
uuid.workspace = true
serde_json.workspace = true

[dev-dependencies]
source.workspace = true
kernel.workspace = true
toml.workspace = true
sqlx.workspace = true
uuid.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
testcontainers-modules = { workspace = true, features = ["postgres"] }
criterion.workspace = true
proptest.workspace = true

# Component bench: document assembly against a live Postgres, for attribution.
# Spins up Postgres in a container, so requires Docker.
[[bench]]
name = "postgres"
harness = false

# In-process component bench: the pgoutput decoder over a recorded WAL fixture
# (`benches/fixtures/pgoutput.bin`, re-recorded by `tests/record_pgoutput.rs`).
# No Docker; this is a PR-gating bench. Needs `--features bench`.
[[bench]]
name = "pgoutput"
harness = false
required-features = ["bench"]
