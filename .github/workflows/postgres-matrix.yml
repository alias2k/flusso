name: postgres-matrix

# The Postgres-backed suites on every tested major but the default (issue #348;
# docs/src/contribute/testing.md). `clippy + tests` in ci.yml already runs the
# default on every PR; this runs the others, one leg per tag:
#
#   plan    The legs: `flusso-test-postgres -- matrix`, the tested tags other
#           than the default (TESTED_TAGS in dev/test-postgres, their one home).
#   leg     Every crate that starts Postgres (`rdeps(flusso-test-postgres)`)
#           under the `ci` profile, with FLUSSO_TEST_PG_TAG set. Its summary
#           names the tests that started a pinned image instead.
#   report  Nightly only: one issue, opened or updated on a failure and
#           closed by a passing nightly (.github/scripts/postgres-matrix.py).
#
# Not a required check. A leg takes about as long as `clippy + tests`, so a PR
# runs it only with the `ci: postgres-matrix` label, reporting through its
# checks alone.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# One nightly at a time (queued, never cancelled); a newer push to a labelled
# PR supersedes its run. An event that runs nothing here (an unlabelled PR,
# another label added) gets a group of its own, so it can't cancel a leg.
concurrency:
  group: >-
    ${{ (github.event_name != 'pull_request'
          || (contains(github.event.pull_request.labels.*.name, 'ci: postgres-matrix')
              && (github.event.action != 'labeled' || github.event.label.name == 'ci: postgres-matrix')))
        && format('postgres-matrix-{0}', github.event.pull_request.number || github.ref)
        || format('postgres-matrix-idle-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan (tested majors)
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'ci: postgres-matrix')
          && (github.event.action != 'labeled' || github.event.label.name == 'ci: postgres-matrix'))
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-test-setup

      - name: Read the tested tags
        id: tags
        run: |
          set -euo pipefail
          tags=$(cargo run -q -p flusso-test-postgres -- matrix)
          echo "tags=$tags" >>"$GITHUB_OUTPUT"
          echo "Legs: $tags" >>"$GITHUB_STEP_SUMMARY"

  leg:
    name: postgres ${{ matrix.tag }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.tags) }}
    env:
      FLUSSO_TEST_PG_TAG: ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v7

      # The same toolchain, nextest and cache steps as `clippy + tests`.
      - uses: ./.github/actions/rust-test-setup

      # The `ci` profile of `clippy + tests`: retries, test groups, JUnit.
      - name: Test (every crate that starts Postgres)
        id: test
        run: cargo nextest run --profile ci --workspace --run-ignored all -E 'rdeps(flusso-test-postgres)'

      - name: Summarize the leg
        if: always()
        run: |
          python3 .github/scripts/postgres-matrix.py summary target/nextest/ci/junit.xml \
            --tag "$FLUSSO_TEST_PG_TAG" --outcome "${{ steps.test.outcome }}" \
            --out "postgres-matrix-$FLUSSO_TEST_PG_TAG.json" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the leg's result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-matrix-${{ matrix.tag }}
          path: |
            postgres-matrix-${{ matrix.tag }}.json
            target/nextest/ci/junit.xml
          if-no-files-found: ignore

  report:
    name: report (nightly issue)
    needs: [plan, leg]
    # Only once the legs are known: with no plan an empty set would read as
    # every leg passing and close the issue.
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Download the legs' results
        uses: actions/download-artifact@v8
        with:
          pattern: postgres-matrix-*
          path: results

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          python3 .github/scripts/postgres-matrix.py issue results --tags "$TAGS" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
