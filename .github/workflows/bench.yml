name: bench

# Two jobs, two purposes (docs/src/contribute/benchmarks.md; ADR 0006):
#
#   in-process   PR gate. The four no-Docker Criterion benches (engine loop,
#                pgoutput decode, sink render, script fields) run twice on the same runner —
#                the PR's base, then the PR, each from its own build. A bench
#                more than 10% slower is re-measured on its own (base, then
#                PR) and the job fails when the re-run, or the mean of both
#                passes, is past 10%: one noisy sample doesn't fail a PR.
#
#   scenarios    History. On every push to main: the in-process benches, the
#                three Docker-backed component benches, and the two flusso-bench
#                scenarios at CI scale on the real binary. Every result becomes
#                a data point on the `benchmarks` branch (rendered under
#                /bench/ on the Pages site), and the regression script calls a
#                regression only when two consecutive points cross the
#                threshold against the rolling median.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  # Supersede in-flight PR runs; never drop a main data point.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  in-process:
    name: in-process (A/B vs base)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # One target dir per tree. A shared one makes the PR run the base's
      # binary: cargo keys a workspace member by its path inside the workspace,
      # so both trees share one fingerprint, and the PR's sources (checked out
      # before the base was built) look older than the base build. Criterion
      # writes both sides' baselines to one CRITERION_HOME, outside the cached
      # target dir, so no earlier run's baselines reach the comparison.
      # BASE_TARGET_DIR and CRITERION_HOME live under $RUNNER_TEMP, which the
      # job-level env can't name; the first step sets them.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Place the base target dir and the Criterion dir
        run: |
          echo "BASE_TARGET_DIR=$RUNNER_TEMP/base-target" >>"$GITHUB_ENV"
          echo "CRITERION_HOME=$RUNNER_TEMP/criterion" >>"$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches ./target (the PR's) only; the base's target dir is seeded from
      # it below, so both sides start from the cached dependencies.
      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      # The base gets its own worktree and target dir, both kept for the whole
      # job so the gate can re-measure a breach on it from its own build. The
      # runner script is taken from the PR, since the base may predate it. A
      # base with none of the in-process benches (exit 78) has nothing to gate
      # against and only warns; any other failure of the base fails the job.
      - name: Bench the base (baseline `base`)
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/base" ${{ github.event.pull_request.base.sha }}
          if [ -d target ]; then
            cp -a --reflink=auto target "$BASE_TARGET_DIR"
          fi
          cd "$RUNNER_TEMP/base"
          status=0
          CARGO_TARGET_DIR="$BASE_TARGET_DIR" "$GITHUB_WORKSPACE/.github/scripts/bench-in-process.sh" base || status=$?
          if [ "$status" -eq 78 ]; then
            echo "::warning::the base has no in-process benches; no baseline to compare against"
            echo "BENCH_BASE_EMPTY=1" >>"$GITHUB_ENV"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Bench the PR (baseline `pr`)
        run: .github/scripts/bench-in-process.sh pr

      - name: Compare (fail past 10% slower, confirmed by a re-run)
        run: .github/scripts/bench-gate.sh "$RUNNER_TEMP/base" "$BASE_TARGET_DIR" 10

  scenarios:
    name: scenarios + components (history)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The storage action pushes to this branch; make sure it exists as an
      # orphan the first time, before anything else touches the tree.
      - name: Ensure the `benchmarks` data branch exists
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin benchmarks >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git worktree add --detach /tmp/benchmarks
          git -C /tmp/benchmarks checkout --orphan benchmarks
          git -C /tmp/benchmarks rm -rfq .
          git -C /tmp/benchmarks commit --allow-empty -m "benchmark history"
          git -C /tmp/benchmarks push origin benchmarks
          git worktree remove --force /tmp/benchmarks

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build flusso (release, no designer — the image configuration)
        run: cargo build --release -p flusso-cli --no-default-features

      - name: In-process benches
        run: |
          .github/scripts/bench-in-process.sh main
          python3 .github/scripts/bench-criterion-to-json.py target/criterion main inprocess bench-out/inprocess.json

      - name: Component benches (Docker)
        run: |
          set -euo pipefail
          cargo bench -p flusso-source-postgres --bench postgres -- --save-baseline components
          cargo bench -p flusso-sink-opensearch --bench opensearch -- --save-baseline components
          cargo bench -p flusso-engine --bench pipeline -- --save-baseline components
          python3 .github/scripts/bench-criterion-to-json.py target/criterion components components bench-out/components.json

      - name: Scenario `reference` (CI scale)
        env:
          FLUSSO_BIN: ${{ github.workspace }}/target/release/flusso
        run: cargo run -p flusso-bench -- --scenario reference --scale ci --out bench-out/scenarios

      - name: Scenario `complex` (CI scale)
        env:
          FLUSSO_BIN: ${{ github.workspace }}/target/release/flusso
        run: cargo run -p flusso-bench -- --scenario complex --scale ci --out bench-out/scenarios

      - name: Merge the data points
        run: |
          set -euo pipefail
          jq -s 'add' bench-out/inprocess.json bench-out/components.json bench-out/scenarios/*/smaller.json > bench-out/smaller.json
          jq -s 'add' bench-out/scenarios/*/bigger.json > bench-out/bigger.json
          jq length bench-out/smaller.json bench-out/bigger.json

      - name: Upload the raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-out
          path: bench-out
          if-no-files-found: ignore

      # Storage + dashboard only. Its own alerting is off (threshold far out of
      # reach): the regression rule lives in bench-regression.py.
      - name: Store (smaller is better)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: flusso (smaller is better)
          tool: customSmallerIsBetter
          output-file-path: bench-out/smaller.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: benchmarks
          benchmark-data-dir-path: smaller
          auto-push: true
          alert-threshold: "10000%"
          comment-on-alert: false
          fail-on-alert: false
          max-items-in-chart: 200

      - name: Store (bigger is better)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: flusso (bigger is better)
          tool: customBiggerIsBetter
          output-file-path: bench-out/bigger.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: benchmarks
          benchmark-data-dir-path: bigger
          auto-push: true
          alert-threshold: "10000%"
          comment-on-alert: false
          fail-on-alert: false
          max-items-in-chart: 200

      # Two consecutive main points past 25% (20% for RSS) against the rolling
      # median of the previous five → one issue, kept current, self-closing.
      - name: Regression check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin benchmarks
          git show origin/benchmarks:smaller/data.js > /tmp/smaller.js
          git show origin/benchmarks:bigger/data.js > /tmp/bigger.js
          python3 .github/scripts/bench-regression.py 25 --rss-threshold 20 --issue /tmp/smaller.js /tmp/bigger.js

      # The storage action pushed with the workflow token, and GitHub does not
      # start workflows from such pushes — so the `benchmarks` push trigger in
      # pages.yml never fires from here. Dispatch the deploy explicitly so
      # /bench/ shows this run's points.
      - name: Redeploy the Pages site with the new points
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
