name: pages

# Publish the GitHub Pages site at https://alias2k.github.io/flusso/. Its parts:
#
#   /            the mdBook user manual as of the newest release (any train)
#   /main/       the same manual as of main's tip: unreleased, banner + noindex
#   /schemas/    the editor-assist JSON Schemas, one immutable directory per release
#   /bench/      the benchmark history dashboards, from the `benchmarks` data branch
#
# Every run rebuilds the whole site, whatever fired it (GitHub Pages deploys one
# artifact). The two manuals come from .github/scripts/build-manuals.sh: the root
# from `docs/` at the newest stable `flusso-{config,cli,query}-v*` tag by creation
# date, `/main/` from `docs/` at origin/main. The overlays that add the banner and
# the cross links live in docs/channels/ and are taken from main, so an old tag
# builds unchanged. The schema tree is rebuilt from EVERY release tag on every
# run (idempotent), so a new release never drops older versions.
#
# A release redeploys the site through the tag triggers below: release-plz pushes
# its tags with a GitHub App token (release-plz.yml), and an App-pushed tag fires
# workflows (the default GITHUB_TOKEN's would not). The `github-pages`
# environment deploys only from main, so a run fired from any other ref (a tag,
# the `benchmarks` branch) deploys nothing itself: it dispatches this workflow on
# main, which rebuilds everything. A dispatch made with GITHUB_TOKEN does fire.
#
# The manual used to live under /docs/ (issue #117 moved it to the root so the
# deep links across the repo and the crate docs resolve). Redirect stubs are
# written at the old /docs/… paths so links published before the move still land;
# they point at the released manual.
#
# Schema pinning — a `# yaml-language-server: $schema=…` modeline (and the `.taplo.toml`
# rule) can target the schema matching the running flusso:
#
#   schemas/v0.3.0/index.schema.yml   exact version — immutable
#   schemas/v0.3/index.schema.yml     newest 0.3.x patch — recommended pin
#   schemas/latest/index.schema.yml   newest version overall
#   (same three forms for config.schema.json)
#
# The schema files live in the config crate, so the schema tree follows the
# `libs` train's `flusso-config-v*` tags (pre-0.16, the two parser crates'
# `flusso-schema-*` tags). Versions
# whose tag predates the in-crate schema layout are skipped (their files lived elsewhere)
# — the schema tree effectively starts at the first release after that move.

on:
  push:
    branches:
      - main
      # The bench workflow pushes each main run's data points here. A push made
      # with the workflow token does not fire this trigger, so bench.yml also
      # dispatches this workflow explicitly; the trigger covers manual pushes
      # (and redeploys through main, like a tag).
      - benchmarks
    # One crate per release train; its tag changes the root manual (and, for
    # flusso-config, the schema tree).
    tags:
      - 'flusso-config-v[0-9]+.[0-9]+.[0-9]+'
      - 'flusso-cli-v[0-9]+.[0-9]+.[0-9]+'
      - 'flusso-query-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions: {}

jobs:
  redeploy-from-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the deploy on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A release pushes up to three of those tags seconds apart, each dispatching
    # a deploy; serialize the deploys (idempotent: each rebuilds the full site
    # from all tags, and a newer pending run replaces an older one). Only this
    # job, so a pending dispatch is never the run that gets replaced.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Tags and branches (origin/main, origin/benchmarks) come with fetch-depth 0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build the released manual at the root and main's under /main/
        run: .github/scripts/build-manuals.sh site origin/main

      - name: Redirect the pre-#117 /docs/ paths
        run: |
          set -euo pipefail
          stub() {  # stub <old path under site/docs> <new path relative to that file>
            mkdir -p "site/docs/$(dirname "$1")"
            printf '<!doctype html><meta charset=utf-8><meta http-equiv="refresh" content="0; url=%s"><link rel=canonical href="%s"><title>flusso</title><p>Moved to <a href="%s">%s</a>.</p>\n' \
              "$2" "$2" "$2" "$2" > "site/docs/$1"
          }
          stub index.html                    ../index.html
          stub introduction.html             ../introduction.html
          stub getting-started.html          ../start/quickstart.html
          stub guides/schema-authoring.html  ../../author/first-schema.html
          stub guides/designing.html         ../../author/design-visually.html
          stub guides/configuration.html     ../../deploy/flusso-toml.html
          stub guides/querying.html          ../../query/overview.html
          stub guides/deploying.html         ../../deploy/docker.html

      # The `benchmarks` branch is written by .github/workflows/bench.yml
      # (github-action-benchmark): `smaller/` and `bigger/` each hold a
      # dashboard `index.html` plus `data.js`. Absent until the first main run.
      - name: Fold in the benchmark history
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet origin/benchmarks >/dev/null; then
            echo "no benchmarks branch yet; skipping /bench/" >&2
            exit 0
          fi
          mkdir -p site/bench
          git archive origin/benchmarks | tar -x -C site/bench
          {
            echo "<!doctype html><meta charset=utf-8><title>flusso benchmarks</title>"
            echo "<h1>flusso benchmark history</h1>"
            echo "<p>One data point per push to <code>main</code>. What each series means, and what counts as a regression, is in the manual's"
            echo "<a href=\"../contribute/benchmarks.html\">Benchmarks</a> chapter.</p><ul>"
            echo "<li><a href=\"smaller/\">Smaller is better</a>: latencies, resource cost, component bench times</li>"
            echo "<li><a href=\"bigger/\">Bigger is better</a>: backfill and drain throughput</li>"
            echo "</ul>"
          } > site/bench/index.html

      - name: Assemble versioned schema site from release tags
        run: |
          set -euo pipefail
          mkdir -p site/schemas
          latest=""
          # Versions come from the config crate's tags (both schema files live
          # in it since 0.16; before that they were split across the two parser
          # crates whose tags are also listed). Ascending order, so a minor alias
          # ends on its highest patch and the final tag overall is `latest`.
          for tag in $(git tag --list 'flusso-schema-index-yaml-v[0-9]*.[0-9]*.[0-9]*' 'flusso-config-v[0-9]*.[0-9]*.[0-9]*' --sort=version:refname); do
            ver="${tag##*-v}"
            case "$tag" in
              flusso-config-v*)
                cfg_tag="$tag"
                idx=libs/1-config/index.schema.yml
                cfg=libs/1-config/config.schema.json ;;
              *)
                cfg_tag="flusso-schema-config-toml-v${ver}"
                idx=libs/2-schema/1-index-yaml/index.schema.yml
                cfg=libs/2-schema/1-config-toml/config.schema.json ;;
            esac
            # Skip versions predating the in-crate schema layout (files moved/renamed
            # since, so `git show` at the current path would fail for old tags).
            git cat-file -e "${tag}:${idx}" 2>/dev/null || continue
            git cat-file -e "${cfg_tag}:${cfg}" 2>/dev/null || continue
            for dest in "v${ver}" "v${ver%.*}"; do
              mkdir -p "site/schemas/${dest}"
              git show "${tag}:${idx}"     > "site/schemas/${dest}/index.schema.yml"
              git show "${cfg_tag}:${cfg}" > "site/schemas/${dest}/config.schema.json"
            done
            latest="${ver}"
          done
          if [ -z "$latest" ]; then
            echo "No release tags carry the in-crate schemas yet; nothing to publish." >&2
            exit 1
          fi
          mkdir -p site/schemas/latest
          git show "${tag}:${idx}"     > site/schemas/latest/index.schema.yml
          git show "${cfg_tag}:${cfg}" > site/schemas/latest/config.schema.json
          {
            echo "<!doctype html><meta charset=utf-8><title>flusso editor schemas</title>"
            echo "<h1>flusso editor-assist schemas</h1>"
            echo "<p>Pin a <code># yaml-language-server: \$schema=…</code> modeline (or a <code>.taplo.toml</code> rule) at"
            echo "<code>schemas/&lt;ref&gt;/…</code> — <code>latest</code>, a minor like <code>v0.3</code>"
            echo "(newest patch, recommended), or an exact <code>v0.3.0</code>. The <a href=\"../\">manual</a> explains each key.</p><ul>"
            for d in $(ls -1 site/schemas | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -rV); do
              echo "<li>${d}: <a href=\"${d}/index.schema.yml\">index</a> · <a href=\"${d}/config.schema.json\">config</a></li>"
            done
            echo "</ul>"
          } > site/schemas/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # One artifact name per attempt: a re-run keeps the earlier attempt's
      # artifact, and deploy-pages refuses a name that matches two.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
