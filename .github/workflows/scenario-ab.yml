# Scenario A/B: `main` against this branch on one runner, interleaved.
# Throwaway: lives only on `bench-ab/**` branches, stores nothing outside the
# run's summary and artifact (never the `benchmarks` history).
name: scenario-ab

on:
  push:
    branches: ["bench-ab/**"]

concurrency:
  group: scenario-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: main in its own worktree and target dir
        run: |
          set -euo pipefail
          git worktree add --detach ../main origin/main
          echo "BRANCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MAIN_SHA=$(git -C ../main rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build the branch (flusso release, no designer; its own flusso-bench)
        run: |
          set -euo pipefail
          cargo build --release -p flusso-cli --no-default-features
          cargo build -p flusso-bench

      - name: Build main (its own target dir)
        working-directory: ../main
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/../main/target-main
        run: |
          set -euo pipefail
          cargo build --release -p flusso-cli --no-default-features
          cargo build -p flusso-bench

      - name: Runner facts
        run: |
          mkdir -p ab-out
          { nproc; lscpu; free -m; } > ab-out/runner.txt
          cat ab-out/runner.txt

      - name: Interleaved runs
        run: |
          set -uo pipefail
          root=$(pwd)
          main_dir=$(cd ../main && pwd)
          failed=0
          run() {
            side=$1; scenario=$2; round=$3; shift 3
            if [ "$side" = main ]; then
              dir=$main_dir; bench=$main_dir/target-main/debug/flusso-bench; bin=$main_dir/target-main/release/flusso
            else
              dir=$root; bench=$root/target/debug/flusso-bench; bin=$root/target/release/flusso
            fi
            label=$side-$scenario-r$round${SUFFIX:-}
            out=$root/ab-out/runs/$label
            mkdir -p "$out"
            echo "$label start $(date -u +%FT%TZ) $(uptime)" >> "$root/ab-out/uptime.txt"
            (cd "$dir" && env FLUSSO_BIN="$bin" "$@" "$bench" --scenario "$scenario" --scale ci --out "$out") > "$out/log.txt" 2>&1
            status=$?
            echo "$label end $(date -u +%FT%TZ) status=$status $(uptime)" >> "$root/ab-out/uptime.txt"
            if [ $status -ne 0 ]; then failed=1; echo "::error::$label did not complete (status $status)"; tail -30 "$out/log.txt"; fi
          }
          for round in 1 2 3 4 5; do
            run main reference $round
            run branch reference $round
          done
          for round in 1 2; do
            run main complex $round
            run branch complex $round
          done
          SUFFIX=-builds1 run main reference 6 FLUSSO_BUILDS=1
          SUFFIX=-builds1 run branch reference 6 FLUSSO_BUILDS=1
          echo "failed=$failed" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: python3 .github/scripts/scenario-ab-summary.py ab-out/runs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-ab
          path: ab-out

      - name: Every run completed
        run: test "${failed:-1}" = 0
