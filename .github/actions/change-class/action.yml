name: Change class
description: >-
  Whether this run is a docs-only pull request (issue #402), and what such a run
  must still check. `.github/scripts/change-class.sh` runs the base's
  `.github/scripts/change_class.py` over the whole PR as it would merge: the
  checkout's merge commit against its first parent, so the checkout needs
  `fetch-depth: 2`. Only a PR into the default branch can be docs-only; any
  other event, base, or a diff or classifier that fails is a full run. Writes
  what was skipped to the job summary.

inputs:
  job:
    description: The gated job, a key of `change_class.py`'s SKIPPED.
    required: true

outputs:
  docs_only:
    description: '`true` when every changed file is documentation.'
    value: ${{ steps.decide.outputs.docs_only }}
  cargo:
    description: '`true` when the job still needs a Rust toolchain.'
    value: ${{ steps.decide.outputs.cargo }}
  nextest_packages:
    description: '`-p <package>` for each package a docs-reading test lives in.'
    value: ${{ steps.decide.outputs.nextest_packages }}
  nextest_filter:
    description: The nextest filterset of the tests that read the changed docs; empty for none.
    value: ${{ steps.decide.outputs.nextest_filter }}
  doc_packages:
    description: Packages whose compiled README changed (doctests + doc links).
    value: ${{ steps.decide.outputs.doc_packages }}

runs:
  using: composite
  steps:
    - name: Decide what this change must run
      id: decide
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        JOB: ${{ inputs.job }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: bash .github/scripts/change-class.sh
