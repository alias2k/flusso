name: Rust test setup
description: >-
  The pinned toolchain, cargo-nextest and the build cache, shared by `ci.yml`'s
  `clippy + tests` jobs and the `postgres-matrix` legs so they cannot drift.
  Runs after `actions/checkout` (a local action needs the checkout first).

inputs:
  shared-key:
    description: >-
      rust-cache's `shared-key`: one cache for several jobs. Empty keeps
      rust-cache's per-job key.
    required: false
    default: ""
  save-if:
    description: >-
      rust-cache's `save-if`, as a string (`"true"` saves). Saves from `main`
      only unless the caller says otherwise: a cache saved per pull request
      fills the repository's 10 GB quota (issue #444).
    required: false
    default: ${{ github.ref == 'refs/heads/main' }}
  cache:
    description: >-
      `"false"` skips the build cache, for a job that builds nothing (the
      `clippy + tests` parts run a nextest archive).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # rust-toolchain.toml names the toolchain and its components (clippy and
    # rustfmt among them); nothing here runs another.
    - name: Install Rust
      uses: ./.github/actions/pinned-rust

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Cache build artifacts
      if: inputs.cache != 'false'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}
