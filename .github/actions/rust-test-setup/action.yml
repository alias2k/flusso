name: Rust test setup
description: >-
  The toolchain, cargo-nextest and the build cache, shared by `ci.yml`'s
  `clippy + tests` jobs and the `postgres-matrix` legs so they cannot drift.
  Runs after `actions/checkout` (a local action needs the checkout first).

inputs:
  components:
    description: Extra rustup components (e.g. `clippy`).
    required: false
    default: ""
  shared-key:
    description: >-
      rust-cache's `shared-key`: one cache for several jobs. Empty keeps
      rust-cache's per-job key.
    required: false
    default: ""
  save-if:
    description: rust-cache's `save-if`, as a string (`"true"` saves).
    required: false
    default: "true"
  cache:
    description: >-
      `"false"` skips the build cache, for a job that builds nothing (the
      `clippy + tests` parts run a nextest archive).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Cache build artifacts
      if: inputs.cache != 'false'
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}
