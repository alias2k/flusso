# release-plz configuration — https://release-plz.dev/docs/config
#
# The workspace releases as THREE independent trains (issue #110), not in
# lockstep. Each crate carries its own `version` (no shared
# [workspace.package] version), and the `version_group`s below keep each
# train internally lockstep while letting the trains diverge:
#
#   * libs  — every libs/* crate. One version: it's one engine. pages.yml
#             reads the editor schemas at the `flusso-config-v*` tag for the
#             versioned editor-schema URLs.
#   * cli   — flusso-cli + flusso-design. The designer SPA is embedded in
#             the binary, so a designer fix ships a CLI release (and via the
#             `flusso-cli-v*` tag, the docker + dist artifacts).
#   * query — flusso-query + flusso-query-derive. The read side; the derive
#             is re-exported behind the `derive` feature and exact-pinned
#             (`=x.y.z`), serde/serde_derive-style.
#
# Trains stay decoupled because the internal version reqs in
# [workspace.dependencies] are MINOR-precision ("0.15", not "0.15.1").
# release-plz rewrites a dependent's req only when the new version no longer
# matches it — so a libs patch releases nothing but libs, while a libs 0.x
# minor (breaking) legitimately cascades a bump to the trains that depend on
# it. Do NOT tighten those reqs to patch precision: every libs patch would
# then rewrite the dependents' manifests and re-couple the trains.
#
# A libs fix reaches the shipped binaries (docker/dist) only when the cli
# train releases: land a `fix(cli): adopt …` commit appending a line to
# apps/cli/ADOPTIONS.md (docker/dist build in-tree from the tag checkout, so
# any cli release carries main-tip libs). `flusso-dev-search-api` and
# `flusso-query-e2e` are publish = false in their manifests, so release-plz
# skips them automatically.

[workspace]
# Surface accidental SemVer breakage as a note in the release PR.
semver_check = true
# Maintain per-crate CHANGELOG.md from conventional commits.
changelog_update = true
# Publish ONLY when the release PR is merged, never on ordinary pushes to main.
# release-plz recognizes the release-PR merge by its `release-plz-*` head branch.
#
# The default (release_always = true) publishes any crate whose version isn't
# already on crates.io on EVERY push — a no-op for existing crates, but a
# brand-new crate is unpublished by definition, so it would be published on the
# feature merge itself, ahead of the version-bump + CHANGELOG the release PR
# carries (stale-dep tarball verify + missing CHANGELOG failures — see #77).
# Gating on the release-PR merge closes that race for new and existing crates
# alike; publishing can never run ahead of the version bump.
release_always = false
# Create the GitHub Release (the dist + docker workflows attach their artifacts
# to the tag it pushes). Set to false if you'd rather dist own the release.
git_release_enable = true

# ─── the libs train ───────────────────────────────────────────────────────────

[[package]]
name = "flusso-kernel"
version_group = "libs"

[[package]]
name = "flusso-kernel-derive"
version_group = "libs"

[[package]]
name = "flusso-source"
version_group = "libs"

[[package]]
name = "flusso-stream"
version_group = "libs"

[[package]]
name = "flusso-sink"
version_group = "libs"

[[package]]
name = "flusso-config"
version_group = "libs"

[[package]]
name = "flusso-source-postgres"
version_group = "libs"

[[package]]
name = "flusso-stream-channel"
version_group = "libs"

[[package]]
name = "flusso-sink-opensearch"
version_group = "libs"

[[package]]
name = "flusso-sink-stdout"
version_group = "libs"

[[package]]
name = "flusso-engine"
version_group = "libs"

[[package]]
name = "flusso-daemon"
version_group = "libs"

# ─── the cli train ────────────────────────────────────────────────────────────

[[package]]
name = "flusso-cli"
version_group = "cli"

[[package]]
name = "flusso-design"
version_group = "cli"

# ─── the query train ──────────────────────────────────────────────────────────

[[package]]
name = "flusso-query"
version_group = "query"

[[package]]
name = "flusso-query-derive"
version_group = "query"
