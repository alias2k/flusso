# yaml-language-server: $schema=https://alias2k.github.io/flusso/schemas/v0.3/index.schema.yml
#
# Worked example: aggregates (the op is the type key) + a custom scaled_float
# for exact money (decimal -> double is lossy).
version: 1
table: users
primary_key: id

fields:
  - integer: id
    required: true
  - keyword: email
    required: true

  # count — always a non-null `long`. No column / value_type.
  - count: orderCount
    table: orders
    foreign_key: user_id

  # avg — nullable `double`. Takes a `column` but no `value_type`.
  - avg: avgOrderTotal
    table: orders
    column: total
    foreign_key: user_id

  # sum/min/max — MUST declare both `column` and `value_type` (mirrors the column).
  # Filters restrict which rows count.
  - sum: lifetimeValue
    table: orders
    column: total
    value_type: decimal
    foreign_key: user_id
    filters:
      - { column: status, op: eq, value: paid }

  - max: lastOrderAt
    table: orders
    column: created_at
    value_type: timestamp
    foreign_key: user_id

  # `column` can be arithmetic over the related table's columns, per row:
  # column names, numbers, + - * /, unary minus, parentheses. No functions.
  - sum: lifetimeItemValue
    table: order_items
    column: quantity * unit_price
    value_type: double
    foreign_key: order_id
    via:
      - { table: orders, foreign_key: user_id }

  # Aggregating across a many-to-many uses `through` INSTEAD of `foreign_key`
  # (exactly one of the two).
  - count: tagCount
    table: tags
    through:
      table: user_tags
      left_key: user_id
      right_key: tag_id

  # ids — a flat array of the related table's PRIMARY KEYS (never null; [] when
  # empty), not a nested body. MUST declare `element_type` (the scalar type of
  # each key); takes no `column`/`value_type`.
  - ids: orderIds
    table: orders
    foreign_key: user_id
    element_type: long

  # ids across a many-to-many: `through` instead of `foreign_key`.
  - ids: tagIds
    table: tags
    through:
      table: user_tags
      left_key: user_id
      right_key: tag_id
    element_type: long

  # exists — a non-null boolean (false over zero rows). No column / value_type.
  - exists: hasOpenOrder
    table: orders
    foreign_key: user_id
    filters:
      - { column: status, op: eq, value: open }

  # Several hops away (users -> orders -> order_items): `via` lists the tables
  # in between, in order from the parent. Each hop's foreign_key points at the
  # table before it; the aggregate's own foreign_key points at the last hop.
  - count: paidItemCount
    table: order_items
    foreign_key: order_id
    via:
      - table: orders
        foreign_key: user_id
        filters:
          - { column: status, op: eq, value: paid }

  # Exact money: decimal -> double loses precision, so declare a custom field.
  - custom: balance
    required: false
    postgres: [numeric]
    opensearch: scaled_float
    options: { scaling_factor: 100 }
