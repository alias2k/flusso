[book]
title = "flusso"
description = "Keep OpenSearch in sync with Postgres, driven by declarative config."
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/alias2k/flusso"
edit-url-template = "https://github.com/alias2k/flusso/edit/main/docs/{path}"
additional-css = []

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true

# The pre-restructure chapter paths (issue #117). Keep these so old links land
# on the page that now owns the topic.
[output.html.redirect]
"/introduction.html" = "start/introduction.html"
"/getting-started.html" = "start/quickstart.html"
"/guides/schema-authoring.html" = "../author/first-schema.html"
"/guides/designing.html" = "../author/design-visually.html"
"/guides/configuration.html" = "../deploy/flusso-toml.html"
"/guides/configuration.html#tls" = "../reference/source-postgres.html#tls"
"/guides/configuration.html#logging--telemetry" = "../reference/environment.html#logging-and-telemetry"
"/guides/configuration.html#index-analysis--subfields" = "../reference/sink-opensearch.html#analysis-and-subfields"
"/guides/querying.html" = "../query/overview.html"
"/guides/deploying.html" = "../deploy/docker.html"
