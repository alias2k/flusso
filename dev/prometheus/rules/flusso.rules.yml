# Derived backlog metrics for flusso.
#
# `flusso_replication_slot_lag_bytes` is the raw backlog (how far behind the WAL
# head flusso's confirmed position is). Its time-derivative is the *net* drain
# rate — consumption minus whatever the source is still writing — so dividing the
# backlog by it gives a time-to-drain estimate that already accounts for ongoing
# writes. The bytes cancel, so the ETA is in seconds; no change-count is needed
# (un-decoded WAL has none).
groups:
  - name: flusso_backlog
    interval: 15s
    rules:
      # Net change in slot lag, bytes/sec, smoothed over 5m.
      #   < 0  → lag shrinking  (catching up)
      #   > 0  → lag growing    (falling behind)
      #   ~ 0  → keeping up in real time
      - record: flusso:slot_lag_bytes_rate5m
        expr: deriv(flusso_replication_slot_lag_bytes[2m])

      # Estimated seconds until the backlog clears at the current net rate
      # (lag / drain_rate). Two guards keep it honest:
      #   * `- rate > 0` — only while actually draining; a flat or growing
      #     backlog has no finite ETA, so the series is simply absent.
      #   * `lag > 4 MiB` — ignore the slot's idle floor. The lag never reaches
      #     zero (Postgres advances the WAL via checkpoints/autovacuum while
      #     flusso's confirmed position only moves on real changes), so a near-
      #     floor lag inching down would otherwise divide to a huge, meaningless
      #     ETA. Raise this above your deployment's steady idle lag.
      - record: flusso:backlog_drain_eta_seconds
        expr: (flusso_replication_slot_lag_bytes > 4194304) / (- flusso:slot_lag_bytes_rate5m > 0)

  # A committed transaction flusso holds because it isn't visible yet: every
  # later change waits behind it. Behind a synchronous standby the wait is a
  # round trip; past 30 s the standby isn't answering (see the source-postgres
  # reference, "Behind a synchronous standby"). flusso also logs a warning after
  # 5 s naming the sessions waiting on synchronous replication.
  - name: flusso_alerts
    rules:
      - alert: FlussoVisibilityWait
        expr: flusso_replication_visibility_wait_seconds > 30
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "flusso has held a commit that isn't visible for {{ $value | humanizeDuration }}"
          description: >-
            Postgres keeps a commit invisible while it waits for a synchronous
            standby. Nothing after it is indexed until it is visible: bring the
            standby back, or take it out of synchronous_standby_names and reload.
          runbook_url: https://alias2k.github.io/flusso/reference/source-postgres.html#behind-a-synchronous-standby

      # A lane (one index into one sink) that has landed nothing for 10
      # minutes pins the slot for every index: Postgres keeps every index's
      # WAL until it moves (ADR 0012). See the runbook, "A lane is stalled".
      - alert: FlussoLaneStalled
        expr: flusso_lane_stall_age_seconds > 600
        for: 5m
        labels:
          severity: page
          reason: age
        annotations:
          summary: "flusso's {{ $labels.index }} lane into {{ $labels.sink }} has landed nothing for {{ $value | humanizeDuration }}"
          description: >-
            The lane's oldest change has not been written to the sink. Until it
            is, the replication slot keeps WAL for every index. Look at the
            sink's errors in the log (a write block on the index, a document
            refused under on_error = "stop", the cluster down), then fix the
            cause, skip the document, or reindex.
          runbook_url: https://alias2k.github.io/flusso/operate/stalled-lane.html

      # The slot keeps 1 GiB of WAL behind a lane that has landed nothing for
      # a minute. The WAL counted includes what flusso hasn't read yet, so a
      # healthy catch-up has a large value too; the age gate (a lane landing
      # steadily stays under a second) keeps it from paging.
      - alert: FlussoLaneStalled
        expr: flusso_lane_wal_behind_bytes > 1073741824 and flusso_lane_stall_age_seconds > 60
        for: 5m
        labels:
          severity: page
          reason: wal
        annotations:
          summary: "flusso's {{ $labels.index }} lane into {{ $labels.sink }} has landed nothing for over a minute while the slot keeps {{ $value | humanize1024 }}B of WAL behind it"
          description: >-
            The lane's oldest change has not been written to the sink. Until it
            is, the replication slot keeps WAL for every index. Look at the
            sink's errors in the log (a write block on the index, a document
            refused under on_error = "stop", the cluster down), then fix the
            cause, skip the document, or reindex.
          runbook_url: https://alias2k.github.io/flusso/operate/stalled-lane.html
