# promtool unit tests for flusso's alerts:
#   docker run --rm --entrypoint promtool -v "$PWD/dev/prometheus/rules:/rules:ro" \
#     prom/prometheus test rules /rules/flusso.rules.test.yml
rule_files:
  - flusso.rules.yml

evaluation_interval: 1m

tests:
  # `users` into `primary` lands nothing: its age grows a minute a minute.
  # `orders` keeps landing: its age stays near zero. Only `users` alerts, once
  # it has been past 10 minutes for 5.
  - interval: 1m
    input_series:
      - series: 'flusso_lane_stall_age_seconds{index="users",sink="primary"}'
        values: '0+60x20'
      - series: 'flusso_lane_stall_age_seconds{index="orders",sink="primary"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: FlussoLaneStalled
        exp_alerts: []
      - eval_time: 16m
        alertname: FlussoLaneStalled
        exp_alerts:
          - exp_labels:
              severity: page
              index: users
              sink: primary
            exp_annotations:
              summary: "flusso's users lane into primary has landed nothing for a while"
              description: >-
                The lane's oldest change has not been written to the sink. Until it
                is, the replication slot keeps WAL for every index. Look at the
                sink's errors in the log (a write block on the index, a document
                refused under on_error = "stop", the cluster down), then fix the
                cause, skip the document, or reindex.

  # A lane holding more than 1 GiB of WAL alerts even while young.
  - interval: 1m
    input_series:
      - series: 'flusso_lane_stall_age_seconds{index="users",sink="primary"}'
        values: '30x10'
      - series: 'flusso_lane_wal_behind_bytes{index="users",sink="primary"}'
        values: '2147483648x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: FlussoLaneStalled
        exp_alerts:
          - exp_labels:
              severity: page
              index: users
              sink: primary
            exp_annotations:
              summary: "flusso's users lane into primary has landed nothing for a while"
              description: >-
                The lane's oldest change has not been written to the sink. Until it
                is, the replication slot keeps WAL for every index. Look at the
                sink's errors in the log (a write block on the index, a document
                refused under on_error = "stop", the cluster down), then fix the
                cause, skip the document, or reindex.
