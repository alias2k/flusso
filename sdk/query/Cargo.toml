[package]
name = "flusso-query"
version = "0.17.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend-neutral OpenSearch/Elasticsearch query client for flusso indexes."
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["database"]
readme.workspace = true

[lib]
name = "flusso_query"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# Re-export the `#[derive(FlussoDocument)]` proc-macro (serde/serde_derive pattern).
derive = ["dep:flusso-query-derive"]
# Make `rust_decimal::Decimal` / `chrono` available for `decimal` / `date` fields.
decimal = ["dep:rust_decimal"]
chrono = ["dep:chrono"]
# Make `uuid::Uuid` a valid `keyword` value (id / foreign-key fields).
uuid = ["dep:uuid"]
# `position::diesel::current` / `position::diesel_async::current`: read the
# source position a fence waits on through the consumer's own database driver.
diesel = ["dep:diesel"]
diesel-async = ["dep:diesel", "dep:diesel-async"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
futures-core = { workspace = true }
# `rt` only: a dropped pinned walk spawns its point-in-time close on the
# caller's runtime (reqwest already requires tokio).
tokio = { workspace = true, features = ["rt"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
webpki-root-certs.workspace = true
flusso-query-derive = { path = "../query-derive", version = "=0.17.0", optional = true }
rust_decimal = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true, features = ["serde"] }
# Backend types only: no libpq, no driver. The consumer brings the connection.
diesel = { version = "2.3", default-features = false, features = ["postgres_backend"], optional = true }
diesel-async = { version = "0.9", default-features = false, optional = true }

# No flusso lib dev-deps here — the combined-search e2e that needs the real
# OpenSearch sink lives in the unpublished `dev/query-e2e` crate, so the query
# release train can't be dragged into a release by a libs bump.
[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
futures = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "time"] }
