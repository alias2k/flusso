# One field of each kind the boundary generator places a type at
# (`tests/boundary.rs`, issue #294). Every field is required, so a type is
# placed bare, and a sample document sets every one.
version: 1
table: boundary
primary_key: id

fields:
  - keyword: id
    required: true
  - keyword: kw
    required: true
  - long: n
    required: true
  - keyword: kwa
    required: true
    array: true
  - object: ob
    fields:
      - keyword: k
        column: ob_k
        required: true
      - long: n
        column: ob_n
        required: true
  - has_many: ne
    table: rows
    foreign_key: boundary_id
    primary_key: id
    fields:
      - keyword: k
        required: true
      - long: n
        required: true
  - map: mp
    values: keyword
    required: true
  - map: mpn
    values: long
    required: true
  - json: js
    required: true
  - json: jsa
    required: true
    array: true
