# One field of each kind the boundary generator places a type at
# (`tests/boundary.rs`, issue #294). A required field takes the type bare, a
# nullable one (the second group) in `Option<…>`.
version: 1
table: boundary
primary_key: id

fields:
  - keyword: id
    required: true
  - keyword: kw
    required: true
  - long: n
    required: true
  - keyword: kwa
    required: true
    array: true
  - object: ob
    fields:
      - keyword: k
        column: ob_k
        required: true
      - long: n
        column: ob_n
        required: true
  - has_many: ne
    table: rows
    foreign_key: boundary_id
    primary_key: id
    fields:
      - keyword: k
        required: true
      - long: n
        required: true
  - map: mp
    values: keyword
    required: true
  - map: mpn
    values: long
    required: true
  - json: js
    required: true
  - json: jsa
    required: true
    array: true
  - geo: gp
    lat: gp_lat
    lon: gp_lon
    required: true
  - keyword: kwo
    required: false
  - long: nn
    required: false
  - keyword: kwao
    required: false
    array: true
  - has_one: ho
    table: ones
    foreign_key: boundary_id
    primary_key: id
    fields:
      - keyword: k
        required: true
      - long: n
        required: true
  - map: mpo
    values: keyword
    required: false
  - json: jso
    required: false
  - date: dt
    required: true
  - timestamp: ts
    required: true
  - constant: cm
    value: [1, "x"]
  - constant: co
    value: { a: 1 }
  - enum: ev
    variants: [a, b]
    required: true
  # The kinds added by issue #306.
  - custom: cu
    postgres: [inet]
    opensearch: ip
    required: true
  - ids: ids
    table: rows
    foreign_key: boundary_id
    element_type: long
  - exists: ex
    table: rows
    foreign_key: boundary_id
  - count: ct
    table: rows
    foreign_key: boundary_id
  - avg: av
    table: rows
    column: n
    foreign_key: boundary_id
  - boolean: bo
    required: false
  - short: sh
    required: true
  - integer: it
    required: true
  - float: fl
    required: true
  - double: db
    required: true
  - decimal: dc
    required: true
  - binary: bi
    required: false
  - uuid: uu
    required: true
  - keyword: kns
    required: true
    subfields: false
  - has_many: hu
    table: rows
    foreign_key: boundary_id
    primary_key: id
    indexed: false
    fields:
      - keyword: k
        required: true
  - belongs_to: bt
    table: ones
    column: one_id
    primary_key: id
    fields:
      - keyword: k
        required: true
  - many_to_many: mm
    table: tags
    through:
      table: boundary_tags
      left_key: boundary_id
      right_key: tag_id
    primary_key: id
    fields:
      - keyword: k
        required: true
