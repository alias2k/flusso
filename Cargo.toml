[workspace]
members = [
  "libs/0-kernel",
  "libs/0-kernel/derive",
  "libs/1-ports/source",
  "libs/1-ports/stream",
  "libs/1-ports/sink",
  "libs/1-config",
  "libs/2-adapters/source-postgres",
  "libs/2-adapters/stream-channel",
  "libs/2-adapters/sink-opensearch",
  "libs/2-adapters/sink-stdout",
  "libs/2-engine",
  "libs/3-daemon",
  "sdk/*",
  "apps/*",
  "dev/search-api",
  "dev/query-e2e",
]
default-members = ["apps/cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/alias2k/flusso"
homepage = "https://github.com/alias2k/flusso"
authors = ["Alias2k"]
description = "Keep OpenSearch in sync with Postgres from declarative config."
keywords = ["postgres", "opensearch", "cdc", "search", "replication"]
categories = ["database", "command-line-utilities"]
readme = "README.md"

[profile.release]
strip = "symbols"
lto = "thin"
opt-level = "z"
codegen-units = 1
panic = "abort"

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
debug = 2

[profile.dev.package."*"]
opt-level = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
# Turn ALL warnings from rustc into errors.
warnings = "deny"

# Forbid unsafe code unless explicitly allowed at the module/fn level.
unsafe_code = "deny"

# Enforce that all public types implement Debug.
# This is invaluable for your Jaeger tracing setup.
missing_debug_implementations = "deny"

# Enforce standard Rust naming conventions.
non_snake_case = "deny"
non_camel_case_types = "deny"
non_upper_case_globals = "deny"
# Find code that can never be reached.
unreachable_patterns = "deny"
unreachable_pub = "deny"
# Find unused variables, imports, etc.
unused_variables = "deny"
unused_imports = "deny"
unused_mut = "deny"
# Find unused imports
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
# Instead, we'll deny the 'recommended' set and add specific high-impact lints.
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }

# Forbid .unwrap() and force proper Result handling.
unwrap_used = "deny"
# Forbid .expect() as well. Panics are not enterprise-grade error handling.
expect_used = "deny"

# Force devs to use your 'tracing' stack instead of println!.
print_stdout = "deny"
print_stderr = "deny"

# Prevent indexing operations that could panic.
indexing_slicing = "deny"

# Prefer `is_empty()` over `len() == 0`.
len_zero = "deny"
# Enforce writing `match` statements in a clearer way.
match_bool = "deny"
iter_next_slice = "allow"

[workspace.dependencies]
serde = { version = "1.0.*", features = ["derive"] }
serde_yaml = { version = "0.9.*" }
thiserror = { version = "2.0.*" }
anyhow = { version = "1.0.*", features = ["backtrace"] }
toml = { version = "1.1.*", features = ["preserve_order"] }
nutype = { version = "0.7.*", features = ["serde", "regex"] }
regex = { version = "1.12.*" }
bon = { version = "3.*" }
rust_decimal = { version = "1.*", features = ["serde-with-str"] }
pgwire-replication = { version = "0.3.*", features = ["md5"] }
async-trait = { version = "0.1.*" }
futures = { version = "0.3.*" }
tracing = { version = "0.1.*" }
tokio = { version = "1.*", default-features = false }
clap = { version = "4.*", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3.*", features = ["env-filter", "json"] }
url = { version = "2.*" }
sqlx = { version = "0.9.*", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "rust_decimal",
  "chrono",
  "uuid",
  "json",
] }
chrono = { version = "0.4.*", default-features = false, features = ["std", "serde"] }
uuid = { version = "1.*", features = ["serde"] }
serde_json = { version = "1.*" }
# Our HTTP client stays on 0.12. The OTLP exporter pulls its own reqwest 0.13
# transitively; deduping would force a 0.13 TLS-feature migration (rustls-tls →
# rustls + a crypto provider) that risks colliding with sqlx's rustls provider,
# so it's a deliberate separate change, not a version bump.
reqwest = { version = "0.12.*", default-features = false }
testcontainers-modules = { version = "0.15.*" }
criterion = { version = "0.8.*", features = ["async_tokio"] }
proptest = { version = "1.*" }
axum = { version = "0.8.*" }
base64 = "0.22"
# Embeds the schema designer's built SPA (`apps/design/dist/`) into the binary.
# `debug-embed` embeds in debug builds too, so the served assets don't depend on
# the working directory and tests are reproducible.
rust-embed = { version = "8.*", features = ["debug-embed"] }
mime_guess = "2.*"
# Opens the designer URL in the user's browser on `flusso design` (best-effort).
open = "5.*"
# OpenTelemetry stack, shared by the CLI (traces) and the daemon (metrics).
# Per-crate feature sets differ and are added at the use site; Cargo unifies
# them. Keep these versions in lockstep — the otel crates release together.
opentelemetry = { version = "0.32.*" }
opentelemetry_sdk = { version = "0.32.*" }
opentelemetry-otlp = { version = "0.32.*" }
opentelemetry-prometheus = { version = "0.32.*" }
tracing-opentelemetry = { version = "0.33.*" }
prometheus = { version = "0.14.*" }

kernel = { path = "libs/0-kernel", version = "0.15", package = "flusso-kernel" }
kernel-derive = { path = "libs/0-kernel/derive", version = "0.15", package = "flusso-kernel-derive" }
source = { path = "libs/1-ports/source", version = "0.15", package = "flusso-source" }
stream = { path = "libs/1-ports/stream", version = "0.15", package = "flusso-stream" }
sink = { path = "libs/1-ports/sink", version = "0.15", package = "flusso-sink" }
config = { path = "libs/1-config", version = "0.15", package = "flusso-config" }

source-postgres = { path = "libs/2-adapters/source-postgres", version = "0.15", package = "flusso-source-postgres" }
stream-channel = { path = "libs/2-adapters/stream-channel", version = "0.15", package = "flusso-stream-channel" }
sink-opensearch = { path = "libs/2-adapters/sink-opensearch", version = "0.15", package = "flusso-sink-opensearch" }
sink-stdout = { path = "libs/2-adapters/sink-stdout", version = "0.15", package = "flusso-sink-stdout" }

engine = { path = "libs/2-engine", version = "0.15", package = "flusso-engine" }
daemon = { path = "libs/3-daemon", version = "0.15", package = "flusso-daemon" }
design = { path = "apps/design", version = "0.15", package = "flusso-design" }
